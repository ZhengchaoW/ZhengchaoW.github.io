speakers:
  - date: "March 30, 2026"
    time: "12:00 - 1:00 pm"
    location: "Zoom"
    seminar: "Geometry and Topology Seminar"
    speaker: "Qingsong Wang"
    affiliation: "UCSD"
    title: "Steering Diffusion Models"
    summary: "A talk on efficient, training-free steering for unconditional diffusion models, using offline guidance signals and transferable concept directions to reduce gradient-based inference overhead."
    source_url: "https://math.missouri.edu/seminars?page=1"
  - date: "April 8, 2026"
    time: "12:00 - 1:00 pm"
    location: "Zoom"
    seminar: "Geometry and Topology Seminar"
    speaker: "Jakiw Pidstrigach"
    affiliation: "Gridmatic"
    title: "Fine-tuning and Steering of Diffusions with Non-Differentiable Rewards"
    summary: "A talk on modifying diffusion and stochastic differential equation models with non-smooth rewards, with examples from diffusion bridges, rare events, and tail-focused generation."
    source_url: "https://math.missouri.edu/seminars?page=1"
  - date: "April 10, 2026"
    time: "12:00 - 1:00 pm"
    location: "Zoom"
    seminar: "Geometry and Topology Seminar"
    speaker: "Qing Qu"
    affiliation: "University of Michigan"
    title: "Harnessing Low-Dimensionality for Generalizable and Trustworthy Generative AI"
    summary: "A mathematical perspective on why low-dimensional structure can help generative models generalize in high ambient dimension, with links to subspace clustering, representation learning, and trustworthy generation."
    source_url: "https://math.missouri.edu/seminars"
  - date: "April 15, 2026"
    time: "12:00 - 1:00 pm"
    location: "Strickland Hall 109"
    seminar: "Geometry and Topology Seminar"
    speaker: "Binxu Wang"
    affiliation: "Harvard"
    title: "Diffusion Models Through the Linear Lens: Exact Analysis of Sampling, Learning, Receptive Fields, and Consistency"
    summary: "A tractable linear-score analysis of diffusion models covering sampling dynamics, deep linear learning dynamics, receptive field structure, and seed-level sample consistency."
    source_url: "https://math.missouri.edu/seminars"
  - date: "April 22, 2026"
    time: "12:00 - 1:00 pm"
    location: "TBA"
    seminar: "Geometry and Topology Seminar"
    speaker: "Ye He"
    affiliation: "Georgia Tech"
    title: "Diffusion Model's Generalization via Data-Dependent Ridge Manifolds"
    summary: "A geometric framework for diffusion-model generation based on data-dependent log-density ridge manifolds, with reach-align-slide dynamics and direction-dependent training-error effects."
    source_url: "https://math.missouri.edu/seminars"
  - date: "April 29, 2026"
    time: "12:00 - 1:00 pm"
    location: "Zoom"
    seminar: "Geometry and Topology Seminar"
    speaker: "Mason Kamb"
    affiliation: "Stanford"
    title: "Local Theories of Diffusion Model Generalization in High Dimensions"
    summary: "A local-theory account of diffusion-model generalization in high-dimensional spaces, emphasizing locality, broken equivariance, combinatorial generation, and spatial consistency failures."
    source_url: "https://math.missouri.edu/seminars"
